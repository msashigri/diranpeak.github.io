<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid background for standalone and maskable safe zone -->
  <rect width="512" height="512" rx="100" fill="#1a2b48"/>
  
  <!-- Subtle circular radiant aura -->
  <circle cx="256" cy="256" r="210" fill="url(#radiant-bg)" opacity="0.15"/>

  <!-- Golden Sun -->
  <circle cx="256" cy="170" r="48" fill="url(#sun-grad)"/>

  <!-- Background Himalayan Peaks -->
  <path d="M120 370L220 220L280 300L350 190L430 370H120Z" fill="#243b61"/>

  <!-- Main Karakoram Snow-Capped Mountain Peak (Diran Peak & K2) -->
  <path d="M256 120L370 370H142L256 120Z" fill="url(#mountain-base)"/>
  
  <!-- Mountain Snow Cap Left Side -->
  <path d="M256 120L290 200L266 185L256 195L246 185L222 200L256 120Z" fill="#ffffff"/>
  
  <!-- Snow Shadow Side -->
  <path d="M256 120L222 200L256 370H142L256 120Z" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Left Supporting Ridge -->
  <path d="M142 370L190 270L256 370H142Z" fill="#38bdf8" fill-opacity="0.3"/>

  <!-- Right Supporting Ridge -->
  <path d="M370 370L320 270L256 370H370Z" fill="#0284c7" fill-opacity="0.3"/>

  <!-- DPA Crest Plaque at the Base -->
  <rect x="146" y="380" width="220" height="60" rx="14" fill="#0f172a" stroke="#5191fa" stroke-width="3"/>
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="4">DIRAN</text>

  <!-- Gradients -->
  <defs>
    <radialGradient id="radiant-bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(210)">
      <stop stop-color="#5191fa"/>
      <stop offset="1" stop-color="#1a2b48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun-grad" x1="256" y1="122" x2="256" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="mountain-base" x1="256" y1="120" x2="256" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.4" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
</svg>

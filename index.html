    <meta property="og:description" content="Authentic clone of Chogori Adventure featuring K2 Base Camp trekking, 8000m Karakoram climbing expeditions, cultural tours, full booking system, and member login &amp; registration." />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cabinet+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // Suppress benign iframe WebSocket and Vite connection logs
      (function() {
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('WebSocket') !== -1)) return;
          origWarn.apply(console, arguments);
        };
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('WebSocket') !== -1)) return;
          origError.apply(console, arguments);
        };
      })();

      // Suppress cross-origin third party script errors (e.g. from sandboxed iframes)
      window.addEventListener('error', function(event) {
        if (!event || event.message === 'Script error.' || (event.filename && event.filename.indexOf('translate.google') !== -1)) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);
      window.onerror = function(message, source) {
        if (message === 'Script error.' || (source && source.indexOf('translate.google') !== -1)) {
          return true;
        }
      };

      // Check saved language on first render
      try {
        var savedCode = localStorage.getItem('dpa_language_code');
        if (savedCode) {
          document.documentElement.lang = savedCode;
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f7f8fa] text-[#1a2b48] antialiased selection:bg-[#5191fa] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
